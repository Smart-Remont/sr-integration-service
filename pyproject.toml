[project]
name = "fsp-tmp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pyhumps>=3.8.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scalar-fastapi>=1.8.2",
    "segno>=1.6.6",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["app"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
