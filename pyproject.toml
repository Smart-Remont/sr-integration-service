[project]
name = "integrations-sr"
version = "0.1.0"
description = "Smart Remont integrations: HTTP layer over PostgreSQL stored functions for bank and partner integrations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scalar-fastapi>=1.8.2",
    "segno>=1.6.6",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["app"]
addopts = ["--import-mode=importlib", "--strict-markers"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "E501",    # long strings and SQL/doc text; code layout is ruff format's job
    "RUF001",  # Cyrillic in user-facing strings is intended
    "RUF002",
    "RUF003",
    "SIM103",  # explicit if/return chains for business rules read better than one boolean
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["src", "_gunicorn"]
