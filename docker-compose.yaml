services:
  backend:
    build:
      context: ./
      dockerfile: ./Dockerfile
    # Only nginx on the same host talks to the service; never publish it on all interfaces.
    ports:
      - "127.0.0.1:9020:8000"
    env_file:
      - ./app/.env
    restart: unless-stopped

    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app
        - action: rebuild
          path: ./pyproject.toml
