<title>Скидка на ремонт от Smart Remont</title>
<style>
:root{--navy:#16233B;--navy2:#22324F;--red:#E1251B;--red2:#C01A12;--bg:#F4F6F9;--card:#fff;--line:#E3E7EE;--ink:#16233B;--muted:#5E6A7D;--green:#2E7D4F;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;background-color:var(--navy);background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320' viewBox='0 0 320 320'><g fill='none' stroke='%23ffffff' stroke-opacity='.07' stroke-width='2'><path d='M20 20h180v110H20zM200 20h100v170H200zM20 130h110v170H20zM130 190h170v110H130z'/><path d='M130 130h70v60h-70z' stroke-dasharray='6 6'/><path d='M95 130a35 35 0 0 1 35-35M200 95a35 35 0 0 0 35 35M130 225a35 35 0 0 1 35 35M265 190a35 35 0 0 0-35-35'/></g><g fill='none' stroke='%23ffffff' stroke-opacity='.045' stroke-width='1'><path d='M40 40h40v30H40zM230 40h50v25h-50zM40 250h60v30H40zM240 240h40v40h-40z'/></g></svg>"),radial-gradient(120% 60% at 100% 0%,rgba(225,37,27,.22),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(90,130,200,.18),transparent 60%),linear-gradient(180deg,#16233B 0%,#1B2A45 55%,#22324F 100%);background-size:320px 320px,auto,auto,auto;background-repeat:repeat,no-repeat,no-repeat,no-repeat}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{height:30px;width:auto;display:block}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;color:var(--muted);padding:8px 12px;cursor:pointer;line-height:1}
.lang button+button{border-left:1px solid var(--line)}
.lang button.active{background:var(--navy);color:#fff}
.hero{color:#fff;padding:28px 0 64px}
h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0}
.card{background:var(--card);border-radius:20px;padding:22px 18px;margin-top:-44px;box-shadow:0 18px 44px rgba(22,35,59,.16)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--navy)}
.field.bad input{border-color:var(--red)}
.ferr{font-size:13px;color:var(--red);margin-top:5px;line-height:1.35}
.combo{position:relative}
.list{list-style:none;margin-top:6px;max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.list li{padding:11px 14px;font-size:15px;cursor:pointer;border-top:1px solid var(--bg)}
.list li:first-child{border-top:0}
.list li.grp{cursor:default;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:7px 14px}
.list li.opt.on,.list li.opt:active{background:#EAF0F8}
.list li.other{font-weight:600;color:var(--red)}
.list li.none{cursor:default;color:var(--muted)}
.other-field{margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;padding:16px 20px;cursor:pointer;text-decoration:none;box-shadow:0 6px 18px rgba(225,37,27,.28);margin-top:6px}
.btn:active{background:var(--red2)}
.btn[disabled]{opacity:.6;cursor:default;box-shadow:none}
.btn.wa{background:#1FAF55;box-shadow:0 6px 18px rgba(31,175,85,.28)}
.consent{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.4}
.consent a{color:var(--muted)}
.formerr{font-size:14px;color:var(--red);background:#FDECEB;border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.4}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.ok{text-align:center;padding:12px 4px 4px}
.ok .ic{width:60px;height:60px;border-radius:50%;background:#E7F5EC;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin:0 auto 14px}
.ok h2{font-size:22px;font-weight:800;color:var(--green)}
.ok p{color:var(--muted);font-size:15px;margin:8px 0 18px}
footer{color:#A9B4C6;font-size:13px;text-align:center;padding:28px 16px 32px}
footer a{color:#fff;font-weight:600;text-decoration:none}
</style>
</head>

     is a typo and is cut. */
  var national = /^8/.test(digits) && (withPlus || digits.length === 11);
  var withCountry = digits.length === 11 && /^7/.test(digits) && !(withPlus && typed);
  if (national || withCountry) { digits = digits.slice(1); }
  return digits.slice(0, 10);
 }

 function formatPhone(digits) {
  if (!digits) { return ""; }
  var out = "+7 (" + digits.slice(0, 3);
  if (digits.length >= 3) { out += ")"; }
  if (digits.length > 3) { out += " " + digits.slice(3, 6); }
  if (digits.length > 6) { out += "-" + digits.slice(6, 8); }
  if (digits.length > 8) { out += "-" + digits.slice(8, 10); }
  return out;
 }

 function onPhoneInput(event) {
  var input = $("phone");
  /* One digit at a time is typing. A paste, an autofill or a keyboard suggestion brings more. */
  var typed = event.inputType === "insertText" && (event.data || "").replace(/\D/g, "").length <= 1;
  var digits = phoneDigitsFrom(input.value, typed);
  /* Deleting a bracket or a dash removes no digit: remove the digit before it. */
  if (event.inputType && event.inputType.indexOf("delete") === 0 && digits === phoneDigits) { digits = digits.slice(0, -1); }
  phoneDigits = digits;
  input.value = formatPhone(digits);
  clearFieldError("phone");
 }

 /* ---------- residential complexes ---------- */
 function normalize(text) {
  return (text || "").toLowerCase().replace(/ё/g, "е").replace(/[«»"'“”.,\-]/g, " ").replace(/\s+/g, " ").trim();
 }

 function loadResidents() {
  fetch(API + "/residents", { headers: { Accept: "application/json" } })
   .then(function (r) { if (!r.ok) { throw new Error("residents " + r.status); } return r.json(); })
   .then(function (rows) {
    residents = rows.map(function (row) {
     return { id: row.resident_id, name: row.resident_name, city: row.city_name || "", key: normalize(row.resident_name + " " + (row.city_name || "")) };
    });
    if (document.activeElement === $("resident")) { renderList(); }
   })
   .catch(function () { residents = []; });
 }

 function li(className, text) {
  var item = document.createElement("li");
  item.className = className;
  item.textContent = text;
  return item;
 }

 function renderList() {
  var list = $("resident-list");
  var words = normalize($("resident").value).split(" ").filter(Boolean);
  var fragment = document.createDocumentFragment();
  var city = null;
  var found = 0;
  for (var i = 0; i < residents.length; i++) {
   var r = residents[i];
   var matches = words.every(function (w) { return r.key.indexOf(w) !== -1; });
   if (!matches) { continue; }
   if (r.city !== city) {
    city = r.city;
    var group = li("grp", city);
    group.setAttribute("role", "presentation");
    fragment.appendChild(group);
   }
   var option = li("opt", r.name);
   option.setAttribute("role", "option");
   option.setAttribute("data-id", String(r.id));
   fragment.appendChild(option);
   found++;
  }
  if (!found && words.length) { fragment.appendChild(li("none", t("resident.none"))); }
  var other = li("opt other", t("resident.other"));
  other.setAttribute("role", "option");
  other.setAttribute("data-id", OTHER);
  fragment.appendChild(other);
  list.textContent = "";
  list.appendChild(fragment);
  list.scrollTop = 0;
  openList(true);
 }

 function openList(open) {
  $("resident-list").hidden = !open;
  $("resident").setAttribute("aria-expanded", open ? "true" : "false");
 }

 function chooseResident(id) {
  var input = $("resident");
  clearFieldError("resident_id");
  if (id === OTHER) {
   residentId = null;
   residentIsOther = true;
   input.value = t("resident.other");
   fieldBox("resident_other").hidden = false;
   openList(false);
   $("resident_other").focus();
   return;
  }
  var r = residents.filter(function (x) { return String(x.id) === id; })[0];
  if (!r) { return; }
  residentId = r.id;
  residentIsOther = false;
  input.value = r.city ? r.name + ", " + r.city : r.name;
  fieldBox("resident_other").hidden = true;
  clearFieldError("resident_other");
  openList(false);
 }

 function moveHighlight(step) {
  var options = $("resident-list").querySelectorAll("li.opt");
  if (!options.length) { return; }
  var current = -1;
  for (var i = 0; i < options.length; i++) { if (options[i].classList.contains("on")) { current = i; options[i].classList.remove("on"); } }
  var next = (current + step + options.length) % options.length;
  options[next].classList.add("on");
  options[next].scrollIntoView({ block: "nearest" });
 }

 function bindResident() {
  var input = $("resident");
  var list = $("resident-list");
  input.addEventListener("focus", function () {
   if (residentId !== null || residentIsOther) { input.select(); }
   renderList();
  });
  input.addEventListener("input", function () {
   residentId = null;
   residentIsOther = false;
   fieldBox("resident_other").hidden = true;
   clearFieldError("resident_id");
   renderList();
  });
  input.addEventListener("keydown", function (event) {
   if (event.key === "ArrowDown" || event.key === "ArrowUp") { event.preventDefault(); moveHighlight(event.key === "ArrowDown" ? 1 : -1); }
   if (event.key === "Enter" && !list.hidden) {
    var on = list.querySelector("li.opt.on");
    if (on) { event.preventDefault(); chooseResident(on.getAttribute("data-id")); }
   }
   if (event.key === "Escape") { openList(false); }
  });
  input.addEventListener("blur", function () { window.setTimeout(function () { openList(false); }, 150); });
  /* Keep the focus in the input while a finger scrolls or taps the list. */
  list.addEventListener("mousedown", function (event) { event.preventDefault(); });
  list.addEventListener("click", function (event) {
   var item = event.target.closest("li.opt");
   if (item) { chooseResident(item.getAttribute("data-id")); }
  });
 }

 /* ---------- checks: the same rules as crm.request_from_bi_badge ---------- */
 function collapse(text) { return (text || "").replace(/\s+/g, " ").trim(); }

 function areaValue() { return collapse($("area").value).replace(",", "."); }

 function validate() {
  var errors = {};
  /* Autofill may set the value without an input event. */
  phoneDigits = phoneDigitsFrom($("phone").value, false);
  var name = collapse($("name").value);
  if (name.length < 2) { errors.name = t("err.name"); } else if (name.length > 100) { errors.name = t("err.name_long"); }
  if (phoneDigits.length !== 10 || phoneDigits.charAt(0) !== "7") { errors.phone = t("err.phone"); }
  if (residentIsOther) {
   var other = collapse($("resident_other").value);
   if (other.length < 2 || other.length > 200) { errors.resident_other = t("err.resident_other"); }
  } else if (residentId === null) {
   errors.resident_id = t("err.resident_id");
  }
  var area = areaValue();
  var number = parseFloat(area);
  if (!/^\d{1,3}(\.\d{1,2})?$/.test(area) || number < 10 || number > 500) { errors.area = t("err.area"); }
  return errors;
 }

 /* ---------- what goes with the application ---------- */
 function newDeviceId() {
  if (window.crypto && typeof window.crypto.randomUUID === "function") { return window.crypto.randomUUID(); }
  var bytes = new Uint8Array(16);
  if (window.crypto && window.crypto.getRandomValues) { window.crypto.getRandomValues(bytes); }
  else { for (var i = 0; i < 16; i++) { bytes[i] = Math.floor(Math.random() * 256); } }
  return Array.prototype.map.call(bytes, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
 }

 function deviceId() {
  var value = storageGet(DEVICE_KEY);
  if (value && /^[A-Za-z0-9-]{8,64}$/.test(value)) { return value; }
  value = newDeviceId();
  storageSet(DEVICE_KEY, value);
  /* Not kept means a new id on every open: then the limit per device means nothing, send none. */
  return storageGet(DEVICE_KEY) === value ? value : null;
 }

 function payload() {
  var query = new URLSearchParams(window.location.search);
  var body = {
   name: collapse($("name").value),
   phone: "+7" + phoneDigits,
   area: areaValue(),
   lang: lang,
   website: $("sr_hp_x9").value
  };
  if (residentIsOther) { body.resident_other = collapse($("resident_other").value); } else { body.resident_id = residentId; }
  ["ref", "utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"].forEach(function (key) {
   var value = query.get(key);
   if (value) { body[key] = value; }
  });
  var device = deviceId();
  if (device) { body.device_id = device; }
  return body;
 }

 /* ---------- sending ---------- */
 function setSending(on) {
  sending = on;
  var button = $("submit");
  button.disabled = on;
  button.textContent = on ? t("sending") : t("submit");
 }

 function showSuccess() {
  $("lead").hidden = true;
  $("ok").hidden = false;
  $("ok").scrollIntoView({ block: "center" });
 }

 function showRefusal(status, data) {
  if (status === 429) { showFormError(t("err.limit")); return; }
  if (status === 422 && data) {
   var field = data.field;
   var known = FIELDS.indexOf(field) !== -1;
   /* The server speaks Russian; the Kazakh page shows its own text of the same field. */
   var text = lang === "ru" ? data.message : (known && t("err." + field)) || t("err.form");
   if (known) { showFieldError(field, text || t("err.form")); } else { showFormError(text || t("err.form")); }
   return;
  }
  showFormError(t("err.form"));
 }

 function submit(event) {
  event.preventDefault();
  if (sending) { return; }
  clearErrors();
  var errors = validate();
  var first = null;
  for (var i = 0; i < FIELDS.length; i++) {
   var field = FIELDS[i];
   if (errors[field]) { showFieldError(field, errors[field]); first = first || field; }
  }
  if (first) {
   var box = fieldBox(first);
   box.scrollIntoView({ block: "center" });
   return;
  }
  setSending(true);
  fetch(API + "/lead", {
   method: "POST",
   headers: { "Content-Type": "application/json", Accept: "application/json" },
   body: JSON.stringify(payload())
  })
   .then(function (r) {
    return r.json().then(function (data) { return { status: r.status, data: data }; }, function () { return { status: r.status, data: null }; });
   })
   .then(function (res) {
    setSending(false);
    if (res.status === 200 && res.data && res.data.ok === true) { showSuccess(); return; }
    showRefusal(res.status, res.data);
   })
   .catch(function () {
    setSending(false);
    showFormError(t("err.form"));
   });
 }

 /* ---------- start ---------- */
 var buttons = document.querySelectorAll(".lang button");
 for (var i = 0; i < buttons.length; i++) {
  buttons[i].addEventListener("click", function () { applyLang(this.getAttribute("data-lang")); });
 }
 $("phone").addEventListener("input", onPhoneInput);
 $("phone").addEventListener("focus", function () { if (!this.value) { this.value = "+7 ("; } });
 $("phone").addEventListener("blur", function () { if (!phoneDigits) { this.value = ""; } });
 ["name", "area", "resident_other"].forEach(function (field) {
  $(field).addEventListener("input", function () { clearFieldError(field); });
 });
 $("lead").addEventListener("submit", submit);
 bindResident();
 applyLang(initialLang());
 loadResidents();
})();
</script>
</body>
</html>
