<script>

    function view_doc(ob) {
        $('#modal-container').find('.modal-dialog').addClass('modal-md');
        $('#modal-container').addClass('doc_modal');
        $("#modal-header-container").empty();
        $("#modal-body-container").empty();
        $('#modal-header-container').append('Просмотр документа');
        $('<iframe>', {
            src: $(ob).closest('.list-group-item').find('input.view_link').val(),
            id:  'myFrame',
            frameborder: 0,
            scrolling: 'no',
            width: "100%",
            height: "80vh",
        }).appendTo('#modal-body-container');

        $("#modal-container").filter('.modal').modal();
    }

    function showClientSignForm(sign_mode, uuid){
        //alert(client_request_document_id);
        $('#modal-container').find('.modal-dialog').addClass('modal-md');
        $('#modal-container').addClass('sign_modal');

        $('.sign_modal').on('hidden.bs.modal', function () {
            location.reload();
        });

        $("#modal-header-container").empty();
        $("#modal-body-container").empty();
        $('#modal-header-container').append('Подписать документ');
        $.ajax({
            type: 'POST',
            url: "/client/client-sign-form/",
            data: {
                uuid: uuid,
                sign_mode: sign_mode
            },
            async: true,
            success: function(data){
                $("#modal-body-container").html(data);
            }
        });
        $("#modal-container").filter('.modal').modal();
    }
